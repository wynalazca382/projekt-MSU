name: Testowanie kodu
on:
  push:
    branches: [main]
    paths-ignore:
        - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
        - '**/*.md'

jobs:
  testy:
    runs-on: ubuntu-24.04
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      -  name: Instalacja zaleznosci
         run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
      - name: Uruchamianie testow
        run: |
          python -m pytest -v
        